@'
services:
  - type: web
    name: studyhub
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: studyhub-db
          property: connectionString
      - key: STUDYHUB_DISABLE_SCHEDULER
        value: "0"
    disk:
      name: uploads-disk
      mountPath: /app/uploads
      sizeGB: 1

databases:
  - name: studyhub-db
    plan: free
    databaseName: studyhub
    user: studyhub_user
'@ | Out-File -Encoding utf8 render.yaml
